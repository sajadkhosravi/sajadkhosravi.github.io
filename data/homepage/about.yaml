# Paragraphs for the About section (Markdown allowed).
bio:
  - "I'm a software engineer, and the problems I enjoy most involve lots of machines working together: splitting up the work, sharing resources sensibly, and keeping things fast without wasting compute or energy."
  - "I started out in industry. From 2018 to 2022 I worked as a software engineer at a few companies in Mashhad, Iran, building and shipping production software, and I finished my MSc in software engineering along the way."
  - "In December 2022 I started a PhD at Linköping University. My research is about scheduling — deciding where and how parallel jobs should run when the hardware is a mix of small edge devices, multicore processors and cloud servers. It has taught me a lot about parallel programming, performance, and the trade-off between speed and energy. I also help teach courses on multicore and GPU programming and on software design."
  - "Now I'd like to take that mix of industry experience and systems know-how back into an engineering team working on **distributed systems or cloud infrastructure**."
