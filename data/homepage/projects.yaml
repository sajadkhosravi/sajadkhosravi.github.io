  - title: "Adaptive software for the edge–cloud continuum"
    kind: "PhD project"
    period: "2022 – present"
    summary: "How do you split parallel work across small edge devices and large cloud servers so it finishes on time without burning extra energy? That question drives my PhD at Linköping University."
    problem: "Edge devices and cloud servers differ a lot in speed and energy cost, so where a job runs makes a real difference to how fast it is and how much power it uses."
    approach: "Scheduling streaming jobs that can run on a flexible number of cores, and tuning CPU clock speeds (DVFS) on mixed multicore processors to save energy."
    tags: ["Scheduling", "Performance", "Energy efficiency", "Parallel computing", "DVFS", "Edge–cloud"]
    links:
      - label: "Publications"
        url: "https://orcid.org/0009-0000-7882-5481"

