<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}" class="dark">
<head>
    {{ partial "head.html" . }}
</head>
<body class="terminal-theme">
    <div class="container">
        <!-- Navigation -->
        {{ partial "header.html" . }}
        
        <!-- Main content -->
        <main class="main" role="main">
            {{ block "main" . }}{{ end }}
        </main>
        
        <!-- Footer -->
        {{ partial "footer.html" . }}
    </div>
    
    <!-- Scripts -->
    {{ partial "head/js.html" . }}
</body>
</html>
