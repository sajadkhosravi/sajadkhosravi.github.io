{{- $about := site.Data.homepage.about -}}
{{- $home := cond .IsHome "" ("/" | relURL) -}}
<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ $home }}#top">
      <span class="brand__mark" aria-hidden="true">sk</span>
      <span class="brand__name">{{ $about.personal.name }}</span>
    </a>
    <nav class="site-nav" aria-label="Sections">
      <ul class="site-nav__list" role="list">
        {{- range $s := partialCached "sections-list.html" . }}
        {{- with $s.nav }}
        <li><a class="site-nav__link" href="{{ $home }}#{{ $s.id }}" data-nav>{{ . }}</a></li>
        {{- end }}
        {{- end }}
      </ul>
    </nav>
    <button class="theme-toggle" type="button" data-theme-toggle hidden aria-label="Switch to dark theme">
      <span class="theme-toggle__to-dark">{{ partial "icon.html" "moon" }}</span>
      <span class="theme-toggle__to-light">{{ partial "icon.html" "sun" }}</span>
    </button>
  </div>
</header>
