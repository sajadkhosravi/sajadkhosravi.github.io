{{ define "main" }}
<section class="section section--plain">
  <div class="wrap prose">
    <h1 class="page-title">{{ .Title }}</h1>
    {{ .Content }}
    <ul>
      {{- range .Pages }}
      <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
      {{- end }}
    </ul>
  </div>
</section>
{{ end }}
