baseURL = 'https://sajadkhosravi.github.io/'
languageCode = 'en-us'
title = 'Sajad Khosravi'
theme = 'cv-one'

# The site is a single page built from data/homepage/*.yaml.
# Taxonomies and RSS are not used.
disableKinds = ['taxonomy', 'term', 'rss']
enableRobotsTXT = false  # static/robots.txt is used instead

[params]
  # Used for <title>, meta description and social previews.
  seo_title = "Sajad Khosravi — Distributed Systems & Cloud Engineer"
  description = "Distributed systems and cloud engineer with industry experience, now doing a PhD at Linköping University on distributed systems, cloud computing and efficient scheduling across edge and cloud. Based in Linköping, Sweden."
  author = "Sajad Khosravi"

  # Portrait, relative to assets/. Hugo resizes it to WebP/JPEG at build time.
  photo = "images/profileimage.jpg"

  # Résumé button (hero + contact). static/papers/cv.pdf is currently a
  # placeholder: replace it with your real résumé, then set enabled = true.
  [params.resume]
    enabled = false
    label = "Résumé (PDF)"
    path = "papers/cv.pdf"

  # Shown in the footer as a "source" link. Remove to hide.
  source = "https://github.com/sajadkhosravi/sajadkhosravi.github.io"

[sitemap]
  changeFreq = 'monthly'

[markup.goldmark.renderer]
  unsafe = false

[imaging]
  quality = 82
  resampleFilter = 'Lanczos'
