baseURL = 'https://sajadkhosravi.github.io/'
languageCode = 'en-us'
title = 'Sajad Khosravi'
theme = 'cv-one'

[params]
  description = "PhD in Edge/Cloud Computing"
  author = "Sajad Khosravi"
  email = "sajad.khosravi@liu.se"
  location = "Sweden"
  linkedin = "https://www.linkedin.com/in/sajadkhosravi/"
  github = "https://github.com/sajadkhosravi"
  scholar = "https://scholar.google.com/citations?user=fRmGZrUAAAAJ&hl=en&oi=ao"
  
  # Theme settings
  dark_mode = true
  terminal_style = true
  show_photo = true
  photo_path = "images/sajad.png"
  
  # Navigation
  show_nav = true
  nav_style = "fixed"
  nav_show_name = false  # Hide name in navbar
  
  # Social links - fully configurable
  [params.social]
    github = "https://github.com/sajadkhosravi"
    linkedin = "https://linkedin.com/in/sajadkhosravi"
    scholar = "https://scholar.google.com/citations?user=yourid"
    email = "mailto:sajad.khosravi@liu.se"
  
  # Section visibility controls
  [params.sections]
    about = true
    research = true
    education = true
    experience = true
    publications = true
    teaching = true
    supervision = false
    awards = false
    skills = true
    languages = true
  
  # Print functionality
  [params.print]
    enabled = false
    button_text = "Download PDF"
    button_icon = "fas fa-download"
    generate_pdf = true
    pdf_filename = "cv.pdf"
  
  # Download CV functionality
  [params.download_cv]
    enabled = false
    button_text = "Download CV"
    pdf_path = "/papers/cv.pdf"
    show_in_navbar = false
  
  # Navigation settings
  [params.navigation]
    highlight_active = true
    smooth_scroll = true

